[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kavach"
version = "0.1.0"
description = "QKD-secured optical network routing: RL-based (PPO/DQN, MLP and GNN policies) vs. classical heuristic baselines, under jamming/intercept-resend attacks and classical-traffic coexistence noise."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=1.0",
    "stable-baselines3>=2.0",
    "torch>=2.0",
    "networkx>=3.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
kavach-workhandler = "kavach.workhandler.cli:main"
